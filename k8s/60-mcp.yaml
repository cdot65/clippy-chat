# clippy-mcp — MCP tool server (streamable HTTP, forwarded bearer auth).
# Cluster-internal ONLY: ClusterIP, no IngressRoute — do not expose.
# Image: registry.cdot.io/clippy/clippy-mcp (built from mcp-server/ in this repo, Forgejo CI).
# Credentials: OnePasswordItem `clippy-mcp-secrets` (see 15-secrets.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clippy-mcp
  namespace: clippy
  labels:
    app: clippy-mcp
    app.kubernetes.io/part-of: clippy-chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clippy-mcp
  template:
    metadata:
      labels:
        app: clippy-mcp
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      containers:
        - name: clippy-mcp
          image: registry.cdot.io/clippy/clippy-mcp:sha-fe3b2a2ba0135ddb4880c3021c957420aa19664a@sha256:4b57c11d5f910e6f25ae53a860f235706e7c480ebd9d7c77b11cfc5949cccc08
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: clippy-mcp-secrets
          env:
            - name: MCP_OIDC_ISSUER
              value: https://auth.dev.cdot.io/realms/truffles
            - name: MCP_OIDC_AUDIENCE
              value: clippy
            - name: MCP_OIDC_AUTHORIZED_PARTY
              value: clippy-mcp-client
            - name: MCP_OIDC_REQUIRED_SCOPE
              value: mcp.invoke
            - name: MCP_OIDC_WORKSPACE
              value: ws-produc-985697
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: clippy-mcp
  namespace: clippy
  labels:
    app: clippy-mcp
    app.kubernetes.io/part-of: clippy-chat
spec:
  type: ClusterIP
  selector:
    app: clippy-mcp
  ports:
    - name: http
      port: 8080
      targetPort: http
