# Stage-only target for issue #11. The StatefulSet remains on its local-path
# volumeClaimTemplate until the separately reviewed cutover change.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clippy-postgres-data-longhorn
  namespace: clippy
  labels:
    app: clippy-postgres
    component: clippy-database
    app.kubernetes.io/part-of: clippy-chat
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-replicated
  resources:
    requests:
      storage: 10Gi
