# clippy-chat app — TanStack Start (Node) chat UI in front of cluster vLLM.
# Image: registry.cdot.io/clippy/clippy-chat (build/push from this repo, Forgejo CI).
# Credentials: OnePasswordItem `clippy-app` (see 15-secrets.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clippy-chat
  namespace: clippy
  labels:
    app: clippy-chat
    app.kubernetes.io/part-of: clippy-chat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clippy-chat
  template:
    metadata:
      labels:
        app: clippy-chat
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      initContainers:
        - name: migrate
          image: registry.cdot.io/clippy/clippy-chat:sha-fe3b2a2ba0135ddb4880c3021c957420aa19664a@sha256:3b9104b409652463bc302409837cf9be4f61a74a0c7eb5e75c9f4544f31f0288
          imagePullPolicy: Always
          command: ["node", "scripts/migrate.mjs"]
          envFrom:
            - secretRef:
                name: clippy-app
      containers:
        - name: app
          image: registry.cdot.io/clippy/clippy-chat:sha-fe3b2a2ba0135ddb4880c3021c957420aa19664a@sha256:3b9104b409652463bc302409837cf9be4f61a74a0c7eb5e75c9f4544f31f0288
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - secretRef:
                name: clippy-app
          env:
            - name: APP_URL
              value: "https://clippy.cdot.io"
            - name: KC_ISSUER
              value: "https://auth.dev.cdot.io/realms/truffles"
            - name: KC_CLIENT_ID
              value: "clippy-web"
            # Inference and MCP both egress through Prisma AIRS. VLLM_API_KEY
            # (the gateway key) arrives via envFrom secretRef clippy-app.
            - name: VLLM_BASE_URL
              value: "http://airs-gw.airs-gw.svc.cluster.local:80"
            - name: VLLM_MODEL
              value: "@vllm2/unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL"
            - name: VLLM_AUTH_MODE
              value: "gateway"
            - name: M2M_SCOPE
              value: "clippy-api"
            - name: MCP_SERVER_URL
              value: "https://mcp-airs.cdot.io/ws-produc-985697/clippy/mcp"
            - name: MCP_AUTH_MODE
              value: "gateway"
            - name: MCP_TOKEN_URL
              valueFrom:
                secretKeyRef:
                  name: clippy-mcp-client
                  key: MCP_TOKEN_URL
            - name: MCP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: clippy-mcp-client
                  key: MCP_CLIENT_ID
            - name: MCP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: clippy-mcp-client
                  key: MCP_CLIENT_SECRET
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: clippy-chat
  namespace: clippy
  labels:
    app: clippy-chat
    app.kubernetes.io/part-of: clippy-chat
spec:
  type: ClusterIP
  selector:
    app: clippy-chat
  ports:
    - name: http
      port: 3000
      targetPort: http
