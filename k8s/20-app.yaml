# clippy-chat app — TanStack Start (Node) chat UI in front of cluster vLLM.
# Image: registry.cdot.io/clippy/clippy-chat (build/push from this repo, Forgejo CI).
# Credentials: OnePasswordItem `clippy-app` (see 15-secrets.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clippy-chat
  namespace: clippy
  labels:
    app: clippy-chat
    app.kubernetes.io/part-of: clippy-chat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clippy-chat
  template:
    metadata:
      labels:
        app: clippy-chat
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      initContainers:
        - name: migrate
          image: registry.cdot.io/clippy/clippy-chat:sha-3eed1fd02e88629e756c33b90690530792f5a2fb@sha256:6491ab94a3f1871291fe06ef5ef74cc18824dc1b5cd40a478a2af5d6e6e83949
          imagePullPolicy: Always
          command: ["node", "scripts/migrate.mjs"]
          envFrom:
            - secretRef:
                name: clippy-app
      containers:
        - name: app
          image: registry.cdot.io/clippy/clippy-chat:sha-3eed1fd02e88629e756c33b90690530792f5a2fb@sha256:6491ab94a3f1871291fe06ef5ef74cc18824dc1b5cd40a478a2af5d6e6e83949
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - secretRef:
                name: clippy-app
          env:
            - name: APP_URL
              value: "https://clippy.cdot.io"
            - name: KC_ISSUER
              value: "https://auth.dev.cdot.io/realms/truffles"
            - name: KC_CLIENT_ID
              value: "clippy-web"
            # Inference and MCP both egress through Prisma AIRS. INFERENCE_API_KEY
            # (the gateway key) is remapped below from clippy-app's VLLM_API_KEY
            # field — the 1Password item still uses that field name; renaming it
            # is a separate, out-of-band change (see clippy-chat#27).
            - name: INFERENCE_BASE_URL
              value: "http://airs-gw.airs-gw.svc.cluster.local:80"
            - name: INFERENCE_MODEL
              value: "@vllm2/unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL"
            - name: INFERENCE_AUTH_MODE
              value: "gateway"
            - name: INFERENCE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: clippy-app
                  key: VLLM_API_KEY
            # Keycloak identity for gateway inference (scope completions.write).
            # optional:true on purpose — the app falls back to INFERENCE_API_KEY
            # while the 1Password item is incomplete; a hard ref would put the
            # pods in CreateContainerConfigError instead.
            - name: INFERENCE_TOKEN_URL
              valueFrom:
                secretKeyRef:
                  name: clippy-inference-client
                  key: INFERENCE_TOKEN_URL
                  optional: true
            - name: INFERENCE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: clippy-inference-client
                  key: INFERENCE_CLIENT_ID
                  optional: true
            - name: INFERENCE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: clippy-inference-client
                  key: INFERENCE_CLIENT_SECRET
                  optional: true
            - name: M2M_SCOPE
              value: "clippy-api"
            - name: MCP_SERVER_URL
              value: "https://mcp-airs.cdot.io/ws-produc-985697/clippy/mcp"
            - name: MCP_AUTH_MODE
              value: "gateway"
            - name: MCP_TOKEN_URL
              valueFrom:
                secretKeyRef:
                  name: clippy-mcp-client
                  key: MCP_TOKEN_URL
            - name: MCP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: clippy-mcp-client
                  key: MCP_CLIENT_ID
            - name: MCP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: clippy-mcp-client
                  key: MCP_CLIENT_SECRET
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: clippy-chat
  namespace: clippy
  labels:
    app: clippy-chat
    app.kubernetes.io/part-of: clippy-chat
spec:
  type: ClusterIP
  selector:
    app: clippy-chat
  ports:
    - name: http
      port: 3000
      targetPort: http
