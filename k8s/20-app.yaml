# clippy-chat app — TanStack Start (Node) chat UI in front of cluster vLLM.
# Image: registry.cdot.io/clippy/clippy-chat (build/push from this repo, Forgejo CI).
# Credentials: OnePasswordItem `clippy-app` (see 15-secrets.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clippy-chat
  namespace: clippy
  labels:
    app: clippy-chat
    app.kubernetes.io/part-of: clippy-chat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clippy-chat
  template:
    metadata:
      labels:
        app: clippy-chat
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      initContainers:
        - name: migrate
          image: registry.cdot.io/clippy/clippy-chat:latest
          imagePullPolicy: Always
          command: ["node", "scripts/migrate.mjs"]
          envFrom:
            - secretRef:
                name: clippy-app
      containers:
        - name: app
          image: registry.cdot.io/clippy/clippy-chat:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - secretRef:
                name: clippy-app
          env:
            - name: APP_URL
              value: "https://clippy.cdot.io"
            - name: KC_ISSUER
              value: "https://auth.dev.cdot.io/realms/truffles"
            - name: KC_CLIENT_ID
              value: "clippy-web"
            - name: VLLM_BASE_URL
              value: "http://vllm-qwen36.vllm.svc.cluster.local:8000"
            - name: VLLM_MODEL
              value: "qwen36-hauhaucs"
            - name: M2M_SCOPE
              value: "clippy-api"
            - name: MCP_SERVER_URL
              value: "http://clippy-mcp.clippy.svc.cluster.local:8080/mcp"
            - name: MCP_TOKEN_URL
              valueFrom:
                secretKeyRef:
                  name: clippy-mcp-client
                  key: MCP_TOKEN_URL
            - name: MCP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: clippy-mcp-client
                  key: MCP_CLIENT_ID
            - name: MCP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: clippy-mcp-client
                  key: MCP_CLIENT_SECRET
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: clippy-chat
  namespace: clippy
  labels:
    app: clippy-chat
    app.kubernetes.io/part-of: clippy-chat
spec:
  type: ClusterIP
  selector:
    app: clippy-chat
  ports:
    - name: http
      port: 3000
      targetPort: http
