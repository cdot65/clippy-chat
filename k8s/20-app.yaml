# clippy-chat app — TanStack Start (Node) chat UI in front of cluster vLLM.
# Image: registry.cdot.io/clippy/clippy-chat (build/push from this repo, Forgejo CI).
# Credentials: OnePasswordItem `clippy-app` (see 15-secrets.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clippy-chat
  namespace: clippy
  labels:
    app: clippy-chat
    app.kubernetes.io/part-of: clippy-chat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clippy-chat
  template:
    metadata:
      labels:
        app: clippy-chat
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      initContainers:
        - name: migrate
          image: registry.cdot.io/clippy/clippy-chat:sha-f1036da66d7b84a4e55813e3da3e73c3f6f4e3ee@sha256:25139aae0c087744504bab2c06683f1f2bca8e43432877c20800fbae65d45de5
          imagePullPolicy: Always
          command: ["node", "scripts/migrate.mjs"]
          envFrom:
            - secretRef:
                name: clippy-app
      containers:
        - name: app
          image: registry.cdot.io/clippy/clippy-chat:sha-f1036da66d7b84a4e55813e3da3e73c3f6f4e3ee@sha256:25139aae0c087744504bab2c06683f1f2bca8e43432877c20800fbae65d45de5
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - secretRef:
                name: clippy-app
          env:
            - name: APP_URL
              value: "https://clippy.cdot.io"
            - name: KC_ISSUER
              value: "https://auth.dev.cdot.io/realms/truffles"
            - name: KC_CLIENT_ID
              value: "clippy-web"
            # Inference and MCP both egress through Prisma AIRS. INFERENCE_API_KEY
            # (the gateway key) is remapped below from clippy-app's VLLM_API_KEY
            # field — the 1Password item still uses that field name; renaming it
            # is a separate, out-of-band change (see clippy-chat#27).
            - name: INFERENCE_BASE_URL
              value: "http://airs-gw.airs-gw.svc.cluster.local:80"
            - name: INFERENCE_MODEL
              value: "@vllm2/unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL"
            - name: INFERENCE_AUTH_MODE
              value: "gateway"
            - name: INFERENCE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: clippy-app
                  key: VLLM_API_KEY
            - name: M2M_SCOPE
              value: "clippy-api"
            - name: MCP_SERVER_URL
              value: "https://mcp-airs.cdot.io/ws-produc-985697/clippy/mcp"
            - name: MCP_AUTH_MODE
              value: "gateway"
            - name: MCP_TOKEN_URL
              valueFrom:
                secretKeyRef:
                  name: clippy-mcp-client
                  key: MCP_TOKEN_URL
            - name: MCP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: clippy-mcp-client
                  key: MCP_CLIENT_ID
            - name: MCP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: clippy-mcp-client
                  key: MCP_CLIENT_SECRET
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: clippy-chat
  namespace: clippy
  labels:
    app: clippy-chat
    app.kubernetes.io/part-of: clippy-chat
spec:
  type: ClusterIP
  selector:
    app: clippy-chat
  ports:
    - name: http
      port: 3000
      targetPort: http
