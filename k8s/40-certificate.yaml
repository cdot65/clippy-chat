apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: clippy-tls
  namespace: clippy
  labels:
    app.kubernetes.io/part-of: clippy-chat
spec:
  secretName: clippy-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: clippy.cdot.io
  dnsNames:
    - clippy.cdot.io
