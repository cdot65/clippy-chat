# OnePasswordItem CRs — reconciled by the 1Password Connect operator
# (ns onepassword-system). Each creates a k8s Secret with the SAME metadata.name;
# Secret data keys mirror 1P field labels 1:1. The operator reaches the
# AI Security Academy vault plus scoped Truffles client-credential items.
#
# Populate AI Security Academy items from live cluster secrets (once) with:
#   ./scripts/sync-clippy-secrets-to-1password.sh
# The scoped Truffles client items are managed by the Keycloak migration workflow.
#
# NOT managed here (still out-of-band):
#   - harbor-pull-secret (dockerconfigjson for registry.cdot.io, robot$clippy+pull —
#                          applied via talos-cluster/clippy-chat/create-harbor-pull-secret.sh)
#   - clippy-tls         (cert-manager Certificate owns this)
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: clippy-postgres
  namespace: clippy
  labels:
    app.kubernetes.io/part-of: clippy-chat
spec:
  itemPath: vaults/AI Security Academy/items/Talos - Clippy Postgres
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: clippy-app
  namespace: clippy
  labels:
    app.kubernetes.io/part-of: clippy-chat
spec:
  itemPath: vaults/AI Security Academy/items/Talos - Clippy App
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: clippy-mcp-secrets
  namespace: clippy
  labels:
    app.kubernetes.io/part-of: clippy-chat
spec:
  itemPath: vaults/AI Security Academy/items/Talos - Clippy MCP
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: clippy-mcp-client
  namespace: clippy
  labels:
    app.kubernetes.io/part-of: clippy-chat
spec:
  itemPath: vaults/Truffles/items/Truffles - Keycloak clippy-mcp-client
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: clippy-inference-client
  namespace: clippy
  labels:
    app.kubernetes.io/part-of: clippy-chat
spec:
  itemPath: vaults/Truffles/items/Truffles - Keycloak clippy-inference-client
