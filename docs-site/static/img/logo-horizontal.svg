<svg width="300" height="80" viewBox="0 0 300 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">Gruvbox docs logo</title>
  <!-- Full horizontal logo: square mark + mono wordmark.
       Edit the <tspan> text to your site name; keep it mono + lowercase. -->
  <rect x="8" y="12" width="56" height="56" rx="12" fill="#fabd2f"/>
  <path d="M22 46 C 26.5 36.5, 33 36.5, 37 42.5 S 47.5 48.5, 52 39"
