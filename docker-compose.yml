services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: clippy
      POSTGRES_PASSWORD: clippy
      POSTGRES_DB: clippy
    ports: ["5433:5432"]
  mcp:
    # Match Talos (amd64); required when building on Apple Silicon
    platform: linux/amd64
    build: ./mcp-server
    ports:
      - "8080:8080"
    environment:
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      SCM_CLIENT_ID: ${SCM_CLIENT_ID:-}
      SCM_CLIENT_SECRET: ${SCM_CLIENT_SECRET:-}
      SCM_TSG_ID: ${SCM_TSG_ID:-}
