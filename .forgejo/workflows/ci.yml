name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # In-cluster npm proxy cache (talos-cluster verdaccio/). CI-only — local
  # installs and any non-cluster CI are unaffected.
  NPM_CONFIG_REGISTRY: https://npm.cdot.io/

permissions:
  contents: read

jobs:
  application:
    runs-on: node
    services:
      postgres:
        image: postgres@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317 # 17.10
        env:
          POSTGRES_USER: clippy
          POSTGRES_PASSWORD: clippy
          POSTGRES_DB: clippy
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U clippy -d clippy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://clippy:clippy@localhost:5433/clippy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: npm ci
      - name: Sync MCP test server
        working-directory: mcp-server
        run: uv sync --locked --group dev
      - name: Run application gates
        shell: bash
        run: |
          uv run --project mcp-server uvicorn clippy_mcp.server:app \
            --host 127.0.0.1 --port 8080 >"${RUNNER_TEMP}/clippy-mcp.log" 2>&1 &
          clippy_mcp_pid=$!
          trap 'kill "${clippy_mcp_pid}" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
              break
            fi
            if [[ "${attempt}" == 30 ]]; then
              sed -n '1,200p' "${RUNNER_TEMP}/clippy-mcp.log"
              exit 1
            fi
            sleep 1
          done

          npm run db:migrate
          npm test
          npm run build
          npm run typecheck

  kubernetes:
    runs-on: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify storage contract
        run: npm test -- k8s/storage.contract.test.ts
      - name: Validate PostgreSQL manifest schemas
        run: >-
          docker run --rm -v "${PWD}:/work:ro"
          ghcr.io/yannh/kubeconform@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
          -strict -summary
          /work/k8s/10-postgres.yaml
          /work/k8s/11-postgres-longhorn-pvc.yaml

  mcp:
    runs-on: python
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run pytest

  documentation:
    runs-on: node
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      - run: npm run build

  build-and-push:
    name: build + push images
    needs: [application, kubernetes, mcp]
    runs-on: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: echo "$HARBOR_PASSWORD" | docker login registry.cdot.io -u "$HARBOR_USERNAME" --password-stdin
      - uses: docker/setup-buildx-action@v4
      - name: Build + push clippy-chat
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            registry.cdot.io/clippy/clippy-chat:sha-${{ github.sha }}
            registry.cdot.io/clippy/clippy-chat:latest
          build-args: |
            NPM_CONFIG_REGISTRY=${{ env.NPM_CONFIG_REGISTRY }}
          platforms: linux/amd64
      - name: Build + push clippy-mcp
        uses: docker/build-push-action@v7
        with:
          context: mcp-server
          file: mcp-server/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            registry.cdot.io/clippy/clippy-mcp:sha-${{ github.sha }}
            registry.cdot.io/clippy/clippy-mcp:latest
          platforms: linux/amd64
