[project]
name = "clippy-mcp"
version = "0.1.0"
description = "Clippy MCP tool server (streamable HTTP)"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.12",
  "httpx>=0.28",
  "PyJWT[crypto]>=2.10,<3",
  "pydantic>=2.9",
  "pan-scm-sdk>=0.3",
  "uvicorn>=0.34",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "respx>=0.22", "ruff>=0.8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clippy_mcp"]
